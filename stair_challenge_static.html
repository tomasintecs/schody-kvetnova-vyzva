<title>Květnová výzva — po schodech</title>

:root { color-scheme: light; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: linear-gradient(160deg,#e0f2fe 0%,#f0f9ff 45%,#f8fafc 100%); min-height: 100vh; color: #1e293b; }
.container { max-width: 860px; margin: 0 auto; padding: 28px 20px 48px; }
.header { text-align: center; margin-bottom: 26px; }
.stair-deco { display: flex; gap: 3px; align-items: flex-end; justify-content: center; margin-bottom: 10px; }
.stair-step { background: linear-gradient(135deg,#bae6fd,#7dd3fc); border-radius: 3px 3px 0 0; }
.header h1 { font-size: 1.75rem; font-weight: 800; color: #0f172a; letter-spacing: -.5px; }
.header p  { color: #64748b; margin-top: 5px; font-size: .88rem; }
.year-tabs { display: flex; gap: 12px; justify-content: center; margin-bottom: 22px; flex-wrap: wrap; }
.year-tab { padding: 10px 28px; border-radius: 50px; border: 2px solid #cbd5e1; background: white; cursor: pointer; font-weight: 600; transition: all .2s; text-align: center; line-height: 1.3; min-width: 140px; }
.year-tab .yr  { font-size: 1.3rem; font-weight: 800; display: block; }
.year-tab .inf { font-size: .72rem; color: #94a3b8; display: block; font-weight: 500; }
.year-tab.active { background: linear-gradient(135deg,#0ea5e9,#0284c7); border-color: transparent; color: white; box-shadow: 0 4px 16px rgba(14,165,233,.38); }
.year-tab.active .inf { color: rgba(255,255,255,.78); }
.gender-filter { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
.gender-btn { padding: 7px 20px; border-radius: 50px; border: 1.5px solid #cbd5e1; background: white; cursor: pointer; font-size: .82rem; font-weight: 600; color: #64748b; transition: all .2s; }
.gender-btn.active { background: #0ea5e9; border-color: transparent; color: white; box-shadow: 0 2px 8px rgba(14,165,233,.3); }
.hero-kpi { background: linear-gradient(135deg,#0ea5e9 0%,#0284c7 100%); border-radius: 20px; padding: 24px 28px; margin-bottom: 16px; display: flex; align-items: center; gap: 20px; box-shadow: 0 6px 24px rgba(14,165,233,.28); color: white; position: relative; overflow: hidden; }
.hero-kpi::after { content: '↑'; position: absolute; right: 24px; font-size: 6rem; font-weight: 900; opacity: .08; top: -10px; line-height: 1; }
.hero-icon { font-size: 2.6rem; flex-shrink: 0; }
.hero-text { flex: 1; }
.hero-value { font-size: 2.6rem; font-weight: 900; line-height: 1; letter-spacing: -1px; }
.hero-label { font-size: .82rem; opacity: .85; margin-top: 4px; font-weight: 500; }
.hero-sub   { font-size: .78rem; opacity: .65; margin-top: 2px; }
.progress-bar-wrap { background: white; border-radius: 14px; padding: 14px 18px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.07); border: 1px solid #f1f5f9; }
.progress-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.progress-title  { font-size: .78rem; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
.progress-days   { font-size: .78rem; font-weight: 700; color: #0ea5e9; }
.progress-track  { height: 8px; background: #e2e8f0; border-radius: 99px; overflow: hidden; }
.progress-fill   { height: 100%; background: linear-gradient(90deg,#38bdf8,#0ea5e9); border-radius: 99px; }
.stats-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 18px; }
.stat { background: white; border-radius: 14px; padding: 16px 12px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,.07); border: 1px solid #f1f5f9; }
.stat-num { font-size: 1.8rem; font-weight: 800; color: #0ea5e9; line-height: 1; }
.stat-lbl { font-size: .7rem; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-top: 5px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width:560px) { .grid { grid-template-columns: 1fr; } }
.card { background: white; border-radius: 18px; padding: 22px; box-shadow: 0 1px 4px rgba(0,0,0,.07); border: 1px solid #f1f5f9; }
.card-title { font-size: .76rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .8px; margin-bottom: 20px; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 6px; margin-bottom: 16px; height: 148px; }
.pod-slot { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 86px; }
.pod-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .78rem; color: white; margin-bottom: 4px; flex-shrink: 0; }
.pod-name { font-size: .69rem; font-weight: 600; text-align: center; color: #334155; margin-bottom: 2px; line-height: 1.2; word-break: break-word; max-width: 82px; }
.pod-val  { font-size: .8rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
.pod-blk  { width: 100%; border-radius: 8px 8px 0 0; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
.r1 .pod-avatar { background: linear-gradient(135deg,#f59e0b,#d97706); }
.r2 .pod-avatar { background: linear-gradient(135deg,#94a3b8,#64748b); }
.r3 .pod-avatar { background: linear-gradient(135deg,#cd7f32,#9a5e1a); }
.r1 .pod-blk { background: linear-gradient(180deg,#fef3c7,#fde68a); height: 80px; }
.r2 .pod-blk { background: linear-gradient(180deg,#f1f5f9,#e2e8f0); height: 60px; }
.r3 .pod-blk { background: linear-gradient(180deg,#fff7ed,#fed7aa); height: 44px; }
.rank-list { display: flex; flex-direction: column; gap: 7px; }
.rank-row  { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: 10px; font-size: .84rem; }
.rank-row.r1 { background: #fffbeb; } .rank-row.r2 { background: #f8fafc; } .rank-row.r3 { background: #fff7ed; }
.rank-row .rname { flex: 1; font-weight: 600; color: #1e293b; }

.yr-records { margin-top: 14px; padding-top: 12px; border-top: 1px solid #f1f5f9; }

let currentLandmark = 'sumava';

/* ── Helpers ── */
function fmtSec(s) {
  if (!s || s >= 99999) return '—';
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
}
function fmtNum(n) { return n.toLocaleString('cs-CZ'); }
function initials(name) { return name.split(' ').map(w=>w[0]||'').join('').slice(0,2).toUpperCase(); }
function firstName(name) { const f=name.split(' ')[0]; return f.length>10?f.slice(0,9)+'…':f; }

/* ── Landmark helpers ── */
function buildingIcon(lm, pct, uid) {
  const H = 56;
  const W = Math.round(H * lm.vw / 100);
  const clipId = 'lc' + uid;
  const p = Math.max(0, Math.min(1, pct));
  const fillY = (100 * (1 - p)).toFixed(1);
  const fillH = (100 - parseFloat(fillY) + 1).toFixed(1);
  function tpl(c1, c2) { return lm.tpl.replace(/C1/g, c1).replace(/C2/g, c2); }
  return `<svg viewBox="0 0 ${lm.vw} 100" width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;overflow:visible">
    <g>${tpl('#c8d4de', '#b0bdc8')}</g>
    ${p > 0.001 ? `<clipPath id="${clipId}"><rect x="-1" y="${fillY}" width="${lm.vw+2}" height="${fillH}"/></clipPath><g clip-path="url(#${clipId})">${tpl(lm.color, lm.colorDark)}</g>` : ''}
  </svg>`;
}

function landmarkPeople(data, metersPerClimb) {
  const p = {};
  for (const [name] of data) {
    if (!p[name]) p[name] = { name, climbs: 0 };
    p[name].climbs++;
  }
  return Object.values(p)
    .map(x => ({ ...x, totalMeters: x.climbs * metersPerClimb }))
    .sort((a, b) => b.totalMeters - a.totalMeters);
}

function renderLandmarks(year, data) {
  const lm = LANDMARKS[currentLandmark];
  const meta = META[year];
  const people = landmarkPeople(data, meta.meters);
  const btns = Object.entries(LANDMARKS).map(([k, v]) =>
    `<button class="lm-btn${k === currentLandmark ? ' active' : ''}" onclick="setLandmark('${k}')">${v.short}</button>`
  ).join('');
  const rows = people.map((p, pi) => {
    const full = Math.floor(p.totalMeters / lm.height);
    const partial = (p.totalMeters % lm.height) / lm.height;
    let icons = '';
    for (let i = 0; i < full; i++) icons += buildingIcon(lm, 1, `${pi}f${i}`);
    if (partial > 0.001) icons += buildingIcon(lm, partial, `${pi}p`);
    return `<div class="lm-row">
      <div class="lm-name">${p.name}</div>
      <div class="lm-meters">${p.totalMeters} m</div>
      <div class="lm-icons">${icons}</div>
    </div>`;
  }).join('');
  return `<div class="landmark-section">
    <div class="lm-card-title">🏗️ Výška výstupů — porovnání se stavbami</div>
    <div class="lm-switcher">${btns}</div>
    ${rows}
  </div>`;
}

function setLandmark(key) {
  currentLandmark = key;
  renderPage(currentYear);
}

function setGender(g) {
  currentGender = g;
  document.querySelectorAll('.gender-btn').forEach(b =>
    b.classList.toggle('active', b.getAttribute('onclick') === `setGender('${g}')`)
  );
  renderPage(currentYear);
}

/* ── Analytics ── */
function analyse(rawData, year) {
  const meta = META[year];
  const people = {};
  for (const [name, sec] of rawData) {
    if (!people[name]) people[name] = { name, climbs:0, best:99999 };
    people[name].climbs++;
    if (sec < people[name].best) people[name].best = sec;
  }
  const arr = Object.values(people);
  return {
    total:       rawData.length,
    unique:      arr.length,
    totalMeters: rawData.length * meta.meters,
    globalBest:  arr.reduce((mn,p) => p.best < mn ? p.best : mn, 99999),
    topClimbs:   [...arr].sort((a,b)=>b.climbs-a.climbs).slice(0,3),
    topSpeed:    [...arr].filter(p=>p.best<99999).sort((a,b)=>a.best-b.best).slice(0,3),
  };
}

/* ── Render helpers ── */
function podium(top3, valFn) {
  const vis = [
    top3[1]?{p:top3[1],r:2,h:60,m:'🥈'}:null,
    top3[0]?{p:top3[0],r:1,h:80,m:'🥇'}:null,
    top3[2]?{p:top3[2],r:3,h:44,m:'🥉'}:null,
  ].filter(Boolean);
  return `<div class="podium">${vis.map(v=>`
    <div class="pod-slot r${v.r}">
      <div class="pod-avatar">${initials(v.p.name)}</div>
      <div class="pod-name">${firstName(v.p.name)}</div>
      <div class="pod-val">${valFn(v.p)}</div>
      <div class="pod-blk" style="height:${v.h}px">${v.m}</div>
    </div>`).join('')}</div>`;
}

function everestSvg(totalMeters) {
  const pct = Math.min(1, totalMeters / 8849);
  const pctD = Math.round(pct * 100);
  const fillH = Math.round(pct * 80);
  const fillY = 88 - fillH;
  const mtn = 'M50,8 L63,38 L71,32 L81,62 L89,57 L95,88 L5,88 L11,57 L19,62 L29,32 L37,38 Z';
  return `<div style="display:flex;flex-direction:column;align-items:center;flex-shrink:0;gap:4px;">
    <svg width="72" height="96" viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg">
      <defs><clipPath id="ev-clip"><rect x="0" y="${fillY}" width="100" height="${fillH+20}"/></clipPath></defs>
      <path d="${mtn}" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="${mtn}" fill="rgba(255,255,255,0.55)" clip-path="url(#ev-clip)"/>
      <path d="M50,8 L59,27 L50,22 L41,27 Z" fill="rgba(255,255,255,0.92)"/>
      <line x1="2" y1="${fillY}" x2="98" y2="${fillY}" stroke="rgba(255,255,255,0.6)" stroke-width="1" stroke-dasharray="4 3"/>
    </svg>
    <div style="color:rgba(255,255,255,0.95);font-size:.82rem;font-weight:800;line-height:1;">${pctD}%</div>
    <div style="color:rgba(255,255,255,0.6);font-size:.65rem;font-weight:500;text-align:center;line-height:1.3;">z Mt. Everestu<br/>(8 849 m)</div>
  </div>`;
}

function challengeProgress() {
  const now = new Date(), start = new Date('2026-05-01'), end = new Date('2026-05-31');
  const total = Math.round((end-start)/86400000)+1;
  const elapsed = Math.max(0, Math.round((now-start)/86400000));
  const daysLeft = Math.max(0, Math.round((end-now)/86400000));
  const pct = Math.min(100, Math.round(elapsed/total*100));
  const label = daysLeft===0 ? 'Výzva skončila!' : `${daysLeft} dní do konce výzvy`;
  return `<div class="progress-bar-wrap">
    <div class="progress-header">
      <span class="progress-title">📅 Průběh výzvy — květen 2026</span>
      <span class="progress-days">${label}</span>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
  </div>`;
}

/* ── Main render ── */
function renderPage(year) {
  const allData = META[year].data;
  const filteredData = currentGender === 'all' ? allData : allData.filter(([name]) => GENDER[name] === currentGender);
  const s = analyse(filteredData, year);
  const meta = META[year];
  const MED = ['🥇','🥈','🥉'], RCL = ['r1','r2','r3'];
  const kmVal = (s.totalMeters/1000).toFixed(2).replace('.',',');
  const heroSub = `${fmtNum(s.total)} výstupů × ${meta.meters} m (${meta.floor}. patro)`;

  document.getElementById('main').innerHTML = `
    <div class="hero-kpi">
      <div class="hero-icon">📐</div>
      <div class="hero-text">
        <div class="hero-value">${fmtNum(s.totalMeters)} m</div>
        <div class="hero-label">Celkem metrů vyšplháno v roce ${year}</div>
        <div class="hero-sub">${heroSub} &nbsp;·&nbsp; ${kmVal} km</div>
      </div>
      ${year===2026 ? everestSvg(s.totalMeters) : ''}
    </div>
    ${year===2026 ? challengeProgress() : ''}
    ${year===2026 && s.totalMeters >= 8849 ? `<div class="congrats-banner"><div class="cb-emoji">🏔️🎉</div><div class="cb-text">Zdolali jsme Mt. Everest, juchúúú. Díky za pomoc.</div></div>` : ''}
    <div class="stats-row">
      <div class="stat"><div class="stat-num">${fmtNum(s.total)}</div><div class="stat-lbl">📋 výstupů</div></div>
      <div class="stat"><div class="stat-num">${s.unique}</div><div class="stat-lbl">👥 účastníků</div></div>
      <div class="stat"><div class="stat-num">${fmtSec(s.globalBest)}</div><div class="stat-lbl">⚡ rekord</div></div>
    </div>
    <div class="grid">
      <div class="card">
        <div class="card-title">🏋️ Nejvíce výstupů</div>
        ${podium(s.topClimbs, p=>`${p.climbs}×`)}
        <div class="rank-list">${s.topClimbs.map((p,i)=>`
          <div class="rank-row ${RCL[i]}"><span>${MED[i]}</span><span class="rname">${p.name}</span><span class="rval">${p.climbs}×</span></div>`).join('')}
        </div>
      </div>
      <div class="card">
        <div class="card-title">⚡ Nejrychlejší čas</div>
        ${podium(s.topSpeed, p=>fmtSec(p.best))}
        <div class="rank-list">${s.topSpeed.map((p,i)=>`
          <div class="rank-row ${RCL[i]}"><span>${MED[i]}</span><span class="rname">${p.name}</span><span class="rval">${fmtSec(p.best)}</span></div>`).join('')}
        </div>
      </div>
    </div>
    ${year===2026 ? renderLandmarks(year, filteredData) : ''}
    <div class="footer">Data ze dne: ${REFRESHED} &nbsp;·&nbsp; Automaticky obnovováno každé ráno</div>`;
}

function setYear(y) {
  currentYear = y;
  document.querySelectorAll('.year-tab').forEach(t => t.classList.toggle('active', parseInt(t.dataset.year)===y));
  renderPage(y);
}

renderPage(currentYear);
</script>
